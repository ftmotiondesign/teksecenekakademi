<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tek Seçenek Akademi | Öğrenci Girişi</title>
<style>
:root{--navy:#292557;--dark:#1c1848;--orange:#f28a00;--bg:#f5f6fa;--muted:#707487}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--navy)}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#292557,#1c1848)}
.card{width:min(720px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 20px 60px #0004}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:24px}.brand img{width:64px;height:64px;object-fit:contain}.brand b{font-size:20px}.brand span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
h1{margin:0 0 8px}.desc{color:var(--muted);line-height:1.6;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr auto;gap:10px}.grid input{padding:13px;border:1px solid #dddfea;border-radius:10px;font:inherit}.grid button{border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:900;padding:0 18px;cursor:pointer}
.result{margin-top:18px}.box{border:1px solid #ececf2;border-radius:14px;padding:15px;margin-top:10px}.box small{color:var(--muted)}.empty{padding:18px;background:#f7f7fa;border-radius:12px;color:var(--muted);margin-top:15px}
.back{display:inline-block;margin-top:18px;font-weight:800;text-decoration:none;color:var(--navy)}
@media(max-width:600px){.grid{grid-template-columns:1fr}.grid button{padding:13px}}
</style>
</head>
<body>
<div class="wrap"><main class="card">
<div class="brand"><img src="logo.png" alt="Tek Seçenek Akademi"><div><b>Tek Seçenek Akademi</b><span>Öğrenci Girişi</span></div></div>
<h1>Sonuçlarını Gör</h1>
<div class="desc">Öğrenci numaranı veya sonuç kodunu girerek yayınlanan sınav sonuçlarını görüntüleyebilirsin.</div>
<div class="grid"><input id="studentCode" placeholder="Öğrenci No / Sonuç Kodu"><button id="studentBtn">Sorgula</button></div>
<div id="studentResult" class="result"></div>
<a class="back" href="index.html">← Ana Sayfaya Dön</a>
</main></div>
<script>
const RESULTS_KEY='tsa_results_v1';
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]))}
document.getElementById('studentBtn').onclick=()=>{
 const q=document.getElementById('studentCode').value.trim().toLowerCase();
 let results=[];try{results=JSON.parse(localStorage.getItem(RESULTS_KEY)||'[]')}catch(e){}
 const list=results.filter(x=>String(x.code||'').toLowerCase()===q||String(x.studentNo||'').toLowerCase()===q);
 const out=document.getElementById('studentResult');
 if(!list.length){out.innerHTML='<div class="empty">Bu bilgiyle eşleşen yayınlanmış sonuç bulunamadı.</div>';return;}
 out.innerHTML=list.map(x=>'<div class="box"><b>'+esc(x.examName||x.code||'Sınav Sonucu')+'</b><br><small>'+esc(x.category||'')+'</small><div style="margin-top:9px">Puan: <b>'+esc(x.score||'-')+'</b> · Yüzdelik: '+esc(x.percentile||'-')+' · Sıralama: '+esc(x.rank||'-')+'</div></div>').join('');
};
</script>
</body>
</html>
